<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zumer/snapdom@2.24.1/dist/snapdom.min.js"></script>
    <?!= include('stylesheet'); ?>
  </head>

  <body class="bg-gray-50 text-gray-800 min-h-screen overflow-y-auto">
    <div
      id="app"
      class="min-h-screen flex flex-col relative"
      data-app-url="<?!= BASE_WEBAPP_URL ?>"
    >
      <?!= include('LayoutHeader'); ?>

      <button
        @click="openAddRestaurantModal"
        v-show="currentTab === 'list' && !isLoading && canEditRestaurant"
        class="fixed bottom-6 right-6 bg-orange-500 bg-opacity-[0.65] hover:bg-opacity-100 text-white w-12 h-12 md:w-14 md:h-14 rounded-full shadow-lg z-30 transition-all transform hover:scale-110 flex items-center justify-center group"
        title="식당 추가"
      >
        <i
          class="ph-bold ph-plus text-xl md:text-2xl group-hover:rotate-90 transition-transform"
        ></i>
      </button>

          <main class="flex-1 relative">
            <?!= include('ViewList'); ?>
            <?!= include('ViewWheel'); ?>
            <?!= include('ViewLunchMate'); ?>
            <?!= include('ViewHallOfFame'); ?>
            <?!= include('ViewMyPage'); ?>
          </main>
      <?!= include('Tooltip'); ?>

      <footer
        class="p-4 bg-gray-200 text-gray-600 text-xs font-bold text-center border-t"
      >
        Made with ♥︎ By 🐟
      </footer>

      <div>
        <?!= include('ModalRestaurant'); ?>
      </div>
      <div>
        <?!= include('ModalAlert'); ?>
        <?!= include('ModalTutorial'); ?>
      </div>

      <transition
        enter-active-class="transition-opacity duration-300"
        enter-from-class="opacity-0"
        enter-to-class="opacity-100"
        leave-active-class="transition-opacity duration-300"
        leave-from-class="opacity-100"
        leave-to-class="opacity-0">
        <div v-if="toast.visible"
          class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] bg-gray-900 bg-opacity-90 text-white text-sm font-bold px-5 py-3 rounded-xl shadow-lg flex items-center gap-2">
          <i class="ph-fill ph-check-circle text-green-400 text-lg"></i> {{ toast.message }}
        </div>
      </transition>
    </div>
  </body>
  <?!= include('javascript'); ?>
</html>
