<script>
  const {
    createApp,
    ref,
    computed,
    onMounted,
    onUnmounted,
    watch,
    watchEffect,
    nextTick,
  } = Vue;

  createApp({
    setup() {
      const kebabButton = ref(null);

      // --- Constants ---
      // App version (kept in sync with the version in the 기능명세서.md title)
      const APP_VERSION = "v1.4.0";
      const GOOGLE_SHEET_URL =
        "https://docs.google.com/spreadsheets/d/1Zs610z6VE5AxeaJblNM8zRDu8fbGgn82F3nR7OId3ok/";
      const appElement = document.getElementById("app");
      const BASE_WEBAPP_URL = appElement ? appElement.dataset.appUrl : "";

      // --- State ---
      const restaurants = ref([]);
      const allReviews = ref([]);
      const currentTab = ref("list");
      const pageSize = ref(30);
      const currentPage = ref(1);

      const windowWidth = ref(window.innerWidth);
      const currentUser = ref({ email: "", profileUrl: "", isAdmin: false });
      const allUsers = ref([]);
      const lunchMateConfig = ref({ mode: "size", value: 4, mixMode: "dev" });
      const selectedUserEmails = ref(new Set());
      const customUsersMap = ref({}); // Custom per-department users: { deptName: [name1, name2] }
      const lunchMateTeams = ref([]); // Final team assignment (shown in full after the animation completes)
      const displayTeams = ref([]); // Teams rendered on screen (filled one by one during the animation)
      const isTeamAnimating = ref(false);
      const currentAnimatingUser = ref(null);
      const isLoading = ref(true);
      const loadingText = ref(
        "사무실 근처 맛집 정보와 솔직 리뷰 불러오는 중... 🚀"
      );
      const loadingInterval = ref(null);
      const currentPhraseIndex = ref(0);

      const LOADING_PHRASES = [
        "사무실 근처 맛집 정보와 솔직 리뷰 불러오는 중... 🚀",
        "룰루랄라 빅데이터 속을 헤엄치는 중...🐟",
        "새로운 꿀팁 리뷰를 수집하고 있습니다. 🍯",
        "지도 데이터를 동기화하고 있습니다. 🗺️",
        "찜 목록과 리뷰 기록을 확인 중입니다. ❤️",
        "리뷰 평점 통계를 계산하고 있습니다. ✨",
        "데이터를 최적화하고 있습니다. 잠시만 기다려주세요. 📊",
        "오늘의 메뉴 추천을 준비 중... 🍜",
      ];

      const RANK_TIERS = [
        {
          name: "아이언",
          min: 0,
          max: 0,
          nextMin: 1,
          icon: "ph ph-crown-simple",
          color: "text-gray-500",
        },
        {
          name: "브론즈",
          min: 1,
          max: 9,
          nextMin: 10,
          icon: "ph-fill ph-crown-simple",
          color: "text-amber-700",
        },
        {
          name: "실버",
          min: 10,
          max: 29,
          nextMin: 30,
          icon: "ph-fill ph-crown-simple",
          color: "text-gray-400",
        },
        {
          name: "골드",
          min: 30,
          max: 49,
          nextMin: 50,
          icon: "ph-fill ph-crown-simple",
          color: "text-yellow-500",
        },
        {
          name: "플래티넘",
          min: 50,
          max: 69,
          nextMin: 70,
          icon: "ph-fill ph-crown",
          color: "text-sky-400",
        },
        {
          name: "다이아몬드",
          min: 70,
          max: 99,
          nextMin: 100,
          icon: "ph-fill ph-diamond",
          color: "text-blue-500",
        },
        {
          name: "블랙 다이아몬드",
          min: 100,
          max: Infinity,
          nextMin: 100,
          icon: "ph-fill ph-diamond",
          color: "text-gray-900 bg-gray-100",
        },
      ];

      const showUserModal = ref(false);

      const isFilterOpen = ref(false);
      const filters = ref({
        categories: [],
        tags: [],
        minRate: 0,
        maxPrice: 0,
      });
      const showLikeFilter = ref(false);
      const showMyReviewsFilter = ref(false);
      const showPendingReviewsFilter = ref(false);
      const searchQuery = ref("");

      const sort = ref({ field: "like_count", order: "desc" });

      const sortDropdownOpen = ref(false);
      const pageSizeDropdownOpen = ref(false);

      const userLikes = ref(new Set());

      const myReviewedRestaurantIds = ref(new Set());
      const menuMap = ref({});

      const modalOpen = ref(false);
      const modalMode = ref("view");
      const selectedRestaurant = ref({});

      const restaurantForm = ref({
        id: "",
        name: "",
        category: "",
        tags: [],
        signature_menu: "",
        price: "",
        tagInput: "",
        menus: [],
      });

      const duplicateList = ref([]);

      const showCategoryDropdown = ref(false);
      const focusedCategoryIndex = ref(-1);

      // Reviews State
      const reviews = ref([]);
      const isSubmitting = ref(false);
      const highlightReviewId = ref(null);
      const reviewForm = ref({ rate: 0, user_name: "", comment: "" });
      const hoverRate = ref(0);
      const editingReviewId = ref(null);
      const editForm = ref({ id: "", rate: 0, comment: "" });
      const isReviewSubmitting = ref(false);

      const alertState = ref({
        visible: false,
        type: "alert",
        title: "",
        message: "",
        resolve: null,
      });

      const showKebabMenu = ref(false);

      // Tooltip & Wheel State
      const tooltipVisible = ref(false);
      const tooltipData = ref({});
      const tooltipPos = ref({ x: 0, y: 0 });
      const wheelItems = ref([]);
      const wheelSearch = ref("");
      const isSpinning = ref(false);
      const winner = ref(null);
      const isWheelListExpanded = ref(true);
      const isComposing = ref(false);

      const myPageTab = ref("info");
      
      // Admin Management
      const adminEmailsList = ref([]);
      const newAdminEmail = ref("");
      const adminGuests = ref([]);
      const newGuestForm = ref({ name: "", email: "", department: "" });
      const excludedEmailsList = ref([]);
      const newExcludedEmail = ref("");
      const isAdminLoading = ref(false);
      
      watch(() => currentUser.value.isAdmin, (isAdmin) => {
        if (isAdmin) {
          loadAdminData();
        }
      });
      
      const loadAdminData = () => {
        isAdminLoading.value = true;
        Promise.all([
          new Promise((resolve) => {
            google.script.run
              .withSuccessHandler((res) => {
                if (res && res.success) adminEmailsList.value = res.data;
                resolve();
              })
              .apiGetAdminEmails();
          }),
          new Promise((resolve) => {
            google.script.run
              .withSuccessHandler((res) => {
                if (res && res.success) adminGuests.value = res.data;
                resolve();
              })
              .apiGetGuests();
          })
        ]).then(() => {
          isAdminLoading.value = false;
        });
      };

      const addAdminEmail = async () => {
        const emailToAdd = newAdminEmail.value.trim().toLowerCase();
        if (!emailToAdd) {
          showAlert("추가할 이메일을 입력해주세요.", "입력 오류");
          return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(emailToAdd)) {
          showAlert("유효한 이메일 형식이 아닙니다.", "입력 오류");
          return;
        }

        if (adminEmailsList.value.some(e => e.toLowerCase() === emailToAdd)) {
          showAlert("이미 등록된 관리자 이메일입니다.", "오류");
          return;
        }

        // Confirm before adding an email missing from the user list (guards against typos)
        const userExists = allUsers.value.some(u => u.email.toLowerCase() === emailToAdd);
        if (!userExists) {
          const confirmed = await showConfirm(`사용자 목록에 존재하지 않는 이메일(${emailToAdd})입니다. 그래도 추가하시겠습니까?`, "사용자 확인");
          if (!confirmed) return;
        }

        // Optimistic UI
        const previousList = [...adminEmailsList.value];
        const newEmailsList = [...adminEmailsList.value, emailToAdd];
        
        adminEmailsList.value = newEmailsList;
        newAdminEmail.value = "";
        
        google.script.run
          .withSuccessHandler((res) => {
            if (!res || !res.success) {
              adminEmailsList.value = previousList;
              showAlert("추가에 실패했습니다.", "오류");
            }
          })
          .withFailureHandler(() => {
            adminEmailsList.value = previousList;
            showAlert("추가에 실패했습니다.", "오류");
          })
          .apiSaveAdminEmails(newEmailsList);
      };

      const deleteAdminEmail = async (emailToDelete) => {
        const confirmed = await showConfirm(`${emailToDelete} 관리자를 삭제하시겠습니까?`);
        if (!confirmed) return;

        // Optimistic UI
        const previousList = [...adminEmailsList.value];
        const newEmailsList = adminEmailsList.value.filter(e => e !== emailToDelete);
        
        adminEmailsList.value = newEmailsList;
        
        google.script.run
          .withSuccessHandler((res) => {
            if (!res || !res.success) {
              adminEmailsList.value = previousList;
              showAlert("삭제에 실패했습니다.", "오류");
            }
          })
          .withFailureHandler(() => {
            adminEmailsList.value = previousList;
            showAlert("삭제에 실패했습니다.", "오류");
          })
          .apiSaveAdminEmails(newEmailsList);
      };

      const addAdminGuest = () => {
        const guestEmail = newGuestForm.value.email.trim().toLowerCase();
        if (!newGuestForm.value.name || !guestEmail) {
          showAlert("이름과 이메일을 입력해주세요.", "입력 오류");
          return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(guestEmail)) {
          showAlert("유효한 이메일 형식이 아닙니다.", "입력 오류");
          return;
        }
        
        const newGuest = { ...newGuestForm.value, email: guestEmail };
        const existingGuest = allUsers.value.find(u => u.email.toLowerCase() === guestEmail);
        if (existingGuest) {
          showAlert("이미 등록된 이메일입니다.", "오류");
          return;
        }
        
        // Optimistic UI
        const addedGuest = {
          name: newGuest.name,
          email: newGuest.email,
          thumbnailPhotoUrl: '',
          department: newGuest.department || 'Guest',
          isGuest: true,
          reviewCount: 0,
          likeCount: 0
        };
        
        const previousAdminGuests = [...adminGuests.value];
        adminGuests.value.push(newGuest);
        
        allUsers.value.push(addedGuest);
        selectedUserEmails.value.add(addedGuest.email);
        
        newGuestForm.value = { name: "", email: "", department: "" };
        
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.success) {
              adminGuests.value = res.data;
            } else {
              // Rollback
              adminGuests.value = previousAdminGuests;
              const idx = allUsers.value.findIndex(u => u.email === newGuest.email);
              if (idx !== -1) allUsers.value.splice(idx, 1);
              selectedUserEmails.value.delete(newGuest.email);
              showAlert("게스트 추가 실패: " + (res ? res.message : ""), "오류");
            }
          })
          .withFailureHandler(() => {
            adminGuests.value = previousAdminGuests;
            const idx = allUsers.value.findIndex(u => u.email === newGuest.email);
            if (idx !== -1) allUsers.value.splice(idx, 1);
            selectedUserEmails.value.delete(newGuest.email);
            showAlert("게스트 추가 실패: 서버 에러", "오류");
          })
          .apiAddGuest(newGuest);
      };

      const deleteAdminGuest = async (email) => {
        const confirmed = await showConfirm("해당 게스트를 삭제하시겠습니까?");
        if (!confirmed) return;
        
        // Optimistic UI
        const previousAdminGuests = [...adminGuests.value];
        adminGuests.value = adminGuests.value.filter(g => g.email !== email);
        
        const previousAllUsers = [...allUsers.value];
        const index = allUsers.value.findIndex(u => u.email === email);
        let removedUser = null;
        if (index !== -1) {
          removedUser = allUsers.value[index];
          allUsers.value.splice(index, 1);
          selectedUserEmails.value.delete(email);
        }
        
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.success) {
              adminGuests.value = res.data;
            } else {
              // Rollback
              adminGuests.value = previousAdminGuests;
              allUsers.value = previousAllUsers;
              if (removedUser) selectedUserEmails.value.add(removedUser.email);
              showAlert("삭제 실패: " + (res ? res.message : ""), "오류");
            }
          })
          .withFailureHandler(() => {
            adminGuests.value = previousAdminGuests;
            allUsers.value = previousAllUsers;
            if (removedUser) selectedUserEmails.value.add(removedUser.email);
            showAlert("삭제 실패: 서버 에러", "오류");
          })
          .apiDeleteGuest(email);
      };

      const addExcludedEmail = async () => {
        const emailToAdd = newExcludedEmail.value.trim().toLowerCase();
        if (!emailToAdd) {
          showAlert("추가할 이메일을 입력해주세요.", "입력 오류");
          return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(emailToAdd)) {
          showAlert("유효한 이메일 형식이 아닙니다.", "입력 오류");
          return;
        }

        if (excludedEmailsList.value.some(e => e.toLowerCase() === emailToAdd)) {
          showAlert("이미 등록된 이메일입니다.", "오류");
          return;
        }

        // Confirm before adding an email missing from the user list (guards against typos)
        const userExists = allUsers.value.some(u => u.email.toLowerCase() === emailToAdd);
        if (!userExists) {
          const confirmed = await showConfirm(`사용자 목록에 존재하지 않는 이메일(${emailToAdd})입니다. 그래도 추가하시겠습니까?`, "사용자 확인");
          if (!confirmed) return;
        }

        // Optimistic UI
        const previousList = [...excludedEmailsList.value];
        const newList = [...excludedEmailsList.value, emailToAdd];
        
        excludedEmailsList.value = newList;
        newExcludedEmail.value = "";
        
        let wasSelected = false;
        if (selectedUserEmails.value.has(emailToAdd)) {
          wasSelected = true;
          selectedUserEmails.value.delete(emailToAdd);
        }
        
        google.script.run
          .withSuccessHandler((res) => {
            if (!res || !res.success) {
              // Rollback
              excludedEmailsList.value = previousList;
              if (wasSelected) selectedUserEmails.value.add(emailToAdd);
              showAlert("추가에 실패했습니다.", "오류");
            }
          })
          .withFailureHandler(() => {
             excludedEmailsList.value = previousList;
             if (wasSelected) selectedUserEmails.value.add(emailToAdd);
             showAlert("추가에 실패했습니다.", "오류");
          })
          .apiSaveExcludedEmails(newList);
      };

      const deleteExcludedEmail = async (emailToDelete) => {
        const confirmed = await showConfirm(`${emailToDelete} 이메일을 제외 명단에서 삭제하시겠습니까?`);
        if (!confirmed) return;

        // Optimistic UI
        const previousList = [...excludedEmailsList.value];
        const newList = excludedEmailsList.value.filter(e => e !== emailToDelete);
        
        excludedEmailsList.value = newList;
        
        google.script.run
          .withSuccessHandler((res) => {
            if (!res || !res.success) {
              excludedEmailsList.value = previousList;
              showAlert("삭제에 실패했습니다.", "오류");
            }
          })
          .withFailureHandler(() => {
            excludedEmailsList.value = previousList;
            showAlert("삭제에 실패했습니다.", "오류");
          })
          .apiSaveExcludedEmails(newList);
      };

      let wheelRotation = 0;
      let wheelVelocity = 0;
      let animationId = null;
      let prevIndex = 0;
      let pinAngle = 0;
      let pinVelocity = 0;
      let pinSpring = 0.2;
      let pinDamping = 0.94;
      let pinKick = 0.15;
      let pinDrag = 0.8;

      // --- Computed ---
      const uniqueCategories = computed(() => {
        const cats = new Set(restaurants.value.map((r) => r.category));
        return Array.from(cats).sort();
      });
      const uniqueTags = computed(() => {
        const tags = new Set();
        restaurants.value.forEach((r) => r.tags.forEach((t) => tags.add(t)));
        return Array.from(tags).sort();
      });

      const isNewCategory = computed(() => {
        const cat = restaurantForm.value.category;
        return cat && !uniqueCategories.value.includes(cat);
      });

      const filteredCategoryOptions = computed(() => {
        const input = (restaurantForm.value.category || "")
          .replace(/\s/g, "")
          .toLowerCase();
        if (!input) return uniqueCategories.value;
        return uniqueCategories.value.filter((cat) =>
          cat.replace(/\s/g, "").toLowerCase().includes(input)
        );
      });

      const filteredRestaurants = computed(() => {
        let result = restaurants.value.filter((r) => {
          if (Number(r.rate) < filters.value.minRate) return false;
          if (
            filters.value.categories.length > 0 &&
            !filters.value.categories.includes(r.category)
          )
            return false;
          if (
            filters.value.tags.length > 0 &&
            !r.tags.some((t) => filters.value.tags.includes(t))
          )
            return false;

          const priceValue = Number(r.price || 0);
          if (
            filters.value.maxPrice > 0 &&
            priceValue > 0 &&
            priceValue > filters.value.maxPrice
          ) {
            return false;
          }

          if (showLikeFilter.value) {
            if (!userLikes.value.has(r.id)) return false;
          }

          if (showMyReviewsFilter.value) {
            if (!myReviewedRestaurantIds.value.has(r.id)) return false;
          }

          if (showPendingReviewsFilter.value) {
            if (myReviewedRestaurantIds.value.has(r.id)) return false;
          }

          if (searchQuery.value) {
            const query = searchQuery.value.replace(/\s/g, "").toLowerCase();
            const targetName = r.name.replace(/\s/g, "").toLowerCase();
            if (!targetName.includes(query)) return false;
          }

          return true;
        });

        if (sort.value.order) {
          result.sort((a, b) => {
            let valA = a[sort.value.field];
            let valB = b[sort.value.field];
            if (typeof valA === "string") valA = valA.toLowerCase();
            if (typeof valB === "string") valB = valB.toLowerCase();

            if (sort.value.field === "rate") {
              valA = Number(a.rate || 0);
              valB = Number(b.rate || 0);
            } else if (sort.value.field === "review_count") {
              valA = Number(a.review_count || 0);
              valB = Number(b.review_count || 0);
            } else if (sort.value.field === "like_count") {
              valA = Number(a.like_count || 0);
              valB = Number(b.like_count || 0);
            } else if (sort.value.field === "price") {
              valA = Number(a.price || 0);
              valB = Number(b.price || 0);
            }

            if (valA < valB) return sort.value.order === "asc" ? -1 : 1;
            if (valA > valB) return sort.value.order === "asc" ? 1 : -1;
            return 0;
          });
        }
        return result;
      });
      const totalPages = computed(() =>
        Math.ceil(filteredRestaurants.value.length / pageSize.value)
      );
      const paginatedRestaurants = computed(() => {
        const start = (currentPage.value - 1) * pageSize.value;
        const end = start + pageSize.value;
        return filteredRestaurants.value.slice(start, end);
      });
      const filteredWheelCandidates = computed(() => {
        if (!wheelSearch.value) return [];
        const term = wheelSearch.value.replace(/\s/g, "").toLowerCase();
        return restaurants.value.filter((r) =>
          r.name.replace(/\s/g, "").toLowerCase().includes(term)
        );
      });

      const selectedUsers = computed(() => {
        return allUsers.value.filter((u) => selectedUserEmails.value.has(u.email));
      });

      const usersByDepartment = computed(() => {
        const groups = {};
        
        allUsers.value.forEach(u => {
          // Backend already filters and assigns "Not Assigned", so use as-is
          const deptName = u.department || 'Not Assigned';
          
          if (!groups[deptName]) groups[deptName] = { users: [], custom: [] };
          groups[deptName].users.push(u);
        });

        Object.keys(customUsersMap.value).forEach(dept => {
           if (!groups[dept]) groups[dept] = { users: [], custom: [] };
           groups[dept].custom = customUsersMap.value[dept];
        });

        return Object.keys(groups).sort().reduce((acc, key) => {
          acc[key] = groups[key];
          return acc;
        }, {});
      });

      const userId = computed(() => {
        if (!currentUser.value.email) return "";
        const atIndex = currentUser.value.email.indexOf("@");
        return atIndex > 0
          ? currentUser.value.email.substring(0, atIndex)
          : currentUser.value.email;
      });

      const userInitial = computed(() => {
        return currentUser.value && currentUser.value.email
          ? currentUser.value.email.charAt(0).toUpperCase()
          : "?";
      });

      // Restaurant info/menu editing is open to all signed-in users
      const canEditRestaurant = computed(() => !!currentUser.value.email);

      const userReviewCount = computed(() => {
        if (!currentUser.value.email || allReviews.value.length === 0) return 0;
        return allReviews.value.filter(
          (review) =>
            String(review.user_email) === String(currentUser.value.email)
        ).length;
      });

      const userRankInfo = computed(() => {
        if (isLoading.value) return null;
        const count = userReviewCount.value;

        const currentRank = RANK_TIERS.slice()
          .reverse()
          .find((tier) => count >= tier.min);

        if (!currentRank) {
          return RANK_TIERS[0];
        }

        const isMaxRank = currentRank.max === Infinity;

        let percentageValue = 0;
        let targetCount = currentRank.nextMin;
        let nextRankName = "";
        let nextRankIcon = "";
        let nextRankColor = "";

        if (!isMaxRank) {
          const currentMin = currentRank.min;
          const totalReviewsNeeded = targetCount - currentMin;
          const reviewsDoneInTier = count - currentMin;

          if (totalReviewsNeeded > 0) {
            percentageValue = (reviewsDoneInTier / totalReviewsNeeded) * 100;
          }
          percentageValue = Math.min(99, Math.floor(percentageValue));

          const nextRankIndex = RANK_TIERS.findIndex(
            (tier) => tier.min === currentRank.nextMin
          );
          if (nextRankIndex !== -1) {
            nextRankName = RANK_TIERS[nextRankIndex].name;
            nextRankIcon = RANK_TIERS[nextRankIndex].icon;
            nextRankColor = RANK_TIERS[nextRankIndex].color;
          }
        } else {
          targetCount = count;
          percentageValue = 100;
        }

        return {
          name: currentRank.name,
          icon: currentRank.icon,
          color: currentRank.color,

          reviewCount: count,
          targetCount: targetCount,
          percentage: percentageValue,
          isMaxRank: isMaxRank,

          nextRankName: nextRankName,
          nextRankIcon: nextRankIcon,
          nextRankColor: nextRankColor,
        };
      });

      const currentRestaurantMenus = computed(() => {
        const restaurantId = selectedRestaurant.value?.id;
        if (restaurantId && menuMap.value[String(restaurantId)]) {
          return menuMap.value[String(restaurantId)];
        }
        return [];
      });

      const sortedMenus = computed(() => {
        const menus = currentRestaurantMenus.value;
        if (!menus || menus.length === 0) return [];

        // Signature menus first (boolean subtraction sorts true before false)
        return [...menus].sort((a, b) => {
          return b.is_signature - a.is_signature;
        });
      });

      const calculatedPriceDisplay = computed(() => {
        return calculateAvgPrice(restaurantForm.value.menus);
      });

      const myLikedRestaurants = computed(() => {
        const liked = restaurants.value.filter((r) =>
          userLikes.value.has(r.id)
        );

        // NOTE: restaurant objects lack the user's liked-at timestamp (likes are stored
        // as an ID Set), so sorting by like time would need an API change; list order for now.
        return liked;
      });

      const myReviews = computed(() => {
        if (!currentUser.value.email) return [];

        const reviewsByUser = allReviews.value
          .filter(
            (r) => String(r.user_email) === String(currentUser.value.email)
          )
          .sort((a, b) => {
            const timeA = new Date(b.updated_at || b.created_at).getTime();
            const timeB = new Date(a.updated_at || a.created_at).getTime();
            return timeA - timeB;
          });

        return reviewsByUser.map((review) => {
          const restaurant = restaurants.value.find(
            (r) => r.id === review.restaurant_id
          );

          const restInfo = restaurant || {
            name: "삭제된 식당",
            category: "N/A",
            rate: 0,
            like_count: 0,
            price: 0,
          };

          return {
            restaurant_id: restInfo.id,
            name: restInfo.name,
            category: restInfo.category,
            like_count: restInfo.like_count,
            rate: restInfo.rate, // restaurant average rating

            id: review.id,
            review_rate: review.rate, // my own rating for this restaurant
            comment: review.comment,
            updated_at: review.updated_at || review.created_at,
          };
        });
      });

      const isMobile = computed(() => {
        return windowWidth.value < 768;
      });

      // --- Internal Helpers (Data Sync) ---
      const updateReviewAndRestaurantState = (
        restId,
        newReview = null,
        deletedReviewId = null
      ) => {
        const rest = restaurants.value.find((r) => r.id === restId);
        if (!rest) return;

        if (newReview) {
          const index = allReviews.value.findIndex(
            (r) => r.id === newReview.id
          );
          if (index !== -1) {
            allReviews.value.splice(index, 1, newReview);
          } else {
            allReviews.value.unshift(newReview);
          }
        } else if (deletedReviewId) {
          const index = allReviews.value.findIndex(
            (r) => r.id === deletedReviewId
          );
          if (index !== -1) {
            allReviews.value.splice(index, 1);
          }
        }

        const filteredReviews = allReviews.value.filter(
          (r) => String(r.restaurant_id) === String(restId)
        );
        const count = filteredReviews.length;
        const sum = filteredReviews.reduce(
          (acc, curr) => acc + Number(curr.rate),
          0
        );
        const avg = count > 0 ? parseFloat((sum / count).toFixed(1)) : 0;

        rest.review_count = count;
        rest.rate = avg;
        rest.latestReview = filteredReviews[0]?.comment || null;
        rest.latestReviewRate = filteredReviews[0]?.rate || null;

        updateCurrentModalReviews(restId);
        updateReviewFilterCache(
          restId,
          newReview ? newReview.user_email : currentUser.value.email,
          deletedReviewId
        );
      };

      const updateReviewFilterCache = (restId, userEmail, deletedReviewId) => {
        if (userEmail === currentUser.value.email) {
          if (!deletedReviewId) {
            myReviewedRestaurantIds.value.add(restId);
          } else {
            const remaining = allReviews.value.some(
              (r) =>
                String(r.restaurant_id) === String(restId) &&
                String(r.user_email) === String(userEmail)
            );
            if (!remaining) {
              myReviewedRestaurantIds.value.delete(restId);
            }
          }
        }
      };

      const updateRestaurantLocalState = (serverData, isEdit) => {
        const existingRest = isEdit
          ? restaurants.value.find((r) => r.id === serverData.id)
          : null;

        const newRestaurant = {
          id: serverData.id,
          name: restaurantForm.value.name,
          category: restaurantForm.value.category,
          tags: restaurantForm.value.tags,
          signature_menu: serverData.signature_menu, // use the signature menu name computed by the server
          price: serverData.price, // use the average price computed by the server
          rate: existingRest ? existingRest.rate : 0,
          like_count: existingRest ? existingRest.like_count : 0,
          review_count: existingRest ? existingRest.review_count : 0,
          // enabled, created_at, updated_at are managed by the server
        };

        if (isEdit) {
          const index = restaurants.value.findIndex(
            (r) => r.id === serverData.id
          );
          if (index !== -1) {
            const currentRest = restaurants.value[index];
            restaurants.value.splice(index, 1, {
              ...currentRest,
              ...newRestaurant,
            });
            selectedRestaurant.value = restaurants.value[index];
          }
        } else {
          restaurants.value.unshift(newRestaurant);
          selectedRestaurant.value = newRestaurant;
        }
      };

      // -------------------------------

      // --- Methods ---
      const showAlert = (message, title = "알림") => {
        return new Promise((resolve) => {
          alertState.value = {
            visible: true,
            type: "alert",
            title,
            message,
            resolve,
          };
        });
      };
      const showConfirm = (message, title = "확인") => {
        return new Promise((resolve) => {
          alertState.value = {
            visible: true,
            type: "confirm",
            title,
            message,
            resolve,
          };
        });
      };
      const onAlertConfirm = () => {
        if (alertState.value.resolve) alertState.value.resolve(true);
        alertState.value.visible = false;
      };
      const onAlertCancel = () => {
        if (alertState.value.resolve) alertState.value.resolve(false);
        alertState.value.visible = false;
      };

      const startLoadingAnimation = (intervalTime = 5000) => {
        if (loadingInterval.value) return;

        const phraseLength = LOADING_PHRASES.length;

        loadingText.value = LOADING_PHRASES[0];

        loadingInterval.value = setInterval(() => {
          let newIndex;
          do {
            newIndex = Math.floor(Math.random() * phraseLength);
          } while (newIndex === currentPhraseIndex.value);

          currentPhraseIndex.value = newIndex;
          loadingText.value = LOADING_PHRASES[newIndex];
        }, intervalTime);
      };

      const stopLoadingAnimation = () => {
        if (loadingInterval.value) {
          clearInterval(loadingInterval.value);
          loadingInterval.value = null;
        }
      };

      const loadData = (callback) => {
        isLoading.value = true;
        startLoadingAnimation(3000);

        const userPromise = new Promise((resolve) => {
          google.script.run
            .withSuccessHandler((res) => {
              console.log("API Response [apiGetCurrentUser]:", res);
              if (res && res.success) {
                currentUser.value = res.data.email
                  ? res.data
                  : { email: "", profileUrl: "", isAdmin: false };
              } else {
                currentUser.value = {
                  email: "",
                  profileUrl: "",
                  isAdmin: false,
                };
              }
              resolve();
            })
            .apiGetCurrentUser();
        });

        const mainDataPromise = new Promise((resolve) => {
          google.script.run
            .withSuccessHandler((res) => {
              console.log("API Response [apiGetRestaurants]:", res);
              if (res && res.success) {
                restaurants.value = res.data;
                resolve(true);
              } else {
                showAlert(
                  "식당 리스트 로드 실패: " +
                    (res?.message || "알 수 없는 오류")
                );
                resolve(false);
              }
            })
            .apiGetRestaurants();
        });

        const reviewDataPromise = new Promise((resolve) => {
          google.script.run
            .withSuccessHandler((res) => {
              console.log("API Response [apiGetAllReviews]:", res);
              if (res && res.success) {
                allReviews.value = res.data.reviews;
                resolve(true);
              } else {
                resolve(false);
              }
            })
            .apiGetAllReviews();
        });

        const likesPromise = new Promise((resolve) => {
          google.script.run
            .withSuccessHandler((res) => {
              console.log("API Response [apiGetUserLikes]:", res);
              if (res && res.success) {
                userLikes.value = new Set(res.data);
              }
              resolve();
            })
            .apiGetUserLikes();
        });

        const menuDataPromise = new Promise((resolve) => {
          google.script.run
            .withSuccessHandler((res) => {
              console.log("API Response [apiGetAllMenus]:", res);
              if (res && res.success) {
                const map = {};
                res.data.forEach((m) => {
                  if (!map[m.restaurant_id]) map[m.restaurant_id] = [];
                  map[m.restaurant_id].push(m);
                });
                menuMap.value = map;
              }
              resolve();
            })
            .apiGetAllMenus();
        });

        const allUsersPromise = new Promise((resolve) => {
          google.script.run
            .withSuccessHandler((res) => {
              console.log("API Response [apiGetAllUsers]:", res);
              if (res && res.success) {
                allUsers.value = res.data;
              } else {
                console.warn(
                  "사용자 전체 목록 로드 실패 (권한 문제일 수 있음):",
                  res?.message
                );
              }
              resolve();
            })
            .apiGetAllUsers();
        });

        const excludedEmailsPromise = new Promise((resolve) => {
          google.script.run
            .withSuccessHandler((res) => {
              if (res && res.success) {
                excludedEmailsList.value = res.data;
              }
              resolve();
            })
            .apiGetExcludedEmails();
        });

        Promise.all([
          userPromise,
          mainDataPromise,
          reviewDataPromise,
          likesPromise,
          menuDataPromise,
          allUsersPromise,
          excludedEmailsPromise
        ]).then(([u, m, r, l, mu, au, ex]) => {
          // Must run after BOTH user and review responses; computing it inside the
          // review handler races with apiGetCurrentUser and can produce an empty set
          const userEmail = currentUser.value.email;
          const reviewedIds = new Set();
          if (userEmail) {
            allReviews.value.forEach((review) => {
              if (String(review.user_email) === String(userEmail)) {
                reviewedIds.add(review.restaurant_id);
              }
            });
          }
          myReviewedRestaurantIds.value = reviewedIds;

          if (allUsers.value.length > 0) {
            const initialSelected = allUsers.value
              .filter(u => !excludedEmailsList.value.includes(u.email))
              .map(u => u.email);
            selectedUserEmails.value = new Set(initialSelected);
          }

          stopLoadingAnimation();
          isLoading.value = false;

          if (m && r) {
            mergeReviewsToRestaurants();
            if (modalOpen.value && selectedRestaurant.value.id) {
              const updated = restaurants.value.find(
                (r) => r.id === selectedRestaurant.value.id
              );
              if (
                updated &&
                (modalMode.value === "view" || modalMode.value === "readonly")
              )
                selectedRestaurant.value = updated;
            }
            if (callback && typeof callback === "function") callback();
          }
        });
      };

      const mergeReviewsToRestaurants = () => {
        if (restaurants.value.length === 0) return;

        restaurants.value.forEach((rest) => {
          const myReviews = allReviews.value.filter(
            (r) => String(r.restaurant_id) === String(rest.id)
          );
          rest.review_count = myReviews.length;
          if (myReviews.length > 0) {
            // Reviews are assumed pre-sorted by created_at, so [0] is the latest
            rest.latestReview = myReviews[0].comment;
            rest.latestReviewRate = myReviews[0].rate;
          } else {
            rest.latestReview = null;
            rest.latestReviewRate = null;
          }
        });
      };

      // Like Logic
      const isLiked = (restId) => userLikes.value.has(restId);
      const toggleLikeFilter = () =>
        (showLikeFilter.value = !showLikeFilter.value);
      const toggleLike = (rest) => {
        if (!currentUser.value.email) {
          showAlert("로그인이 필요합니다.");
          return;
        }

        const wasLiked = userLikes.value.has(rest.id);
        if (wasLiked) {
          userLikes.value.delete(rest.id);
          rest.like_count = Math.max(0, (rest.like_count || 0) - 1);
        } else {
          userLikes.value.add(rest.id);
          rest.like_count = (rest.like_count || 0) + 1;
        }
        bumpMyHofStats({ like: wasLiked ? -1 : 1 });

        google.script.run
          .withSuccessHandler((res) => {
            if (!res.success) {
              if (wasLiked) {
                userLikes.value.add(rest.id);
                rest.like_count++;
              } else {
                userLikes.value.delete(rest.id);
                rest.like_count--;
              }
              bumpMyHofStats({ like: wasLiked ? 1 : -1 });
              showAlert("찜하기 실패", "처리 실패");
            }
          })
          .apiToggleLike(rest.id);
      };

      const addLikedToWheel = () => {
        const likedRests = restaurants.value.filter((r) =>
          userLikes.value.has(r.id)
        );
        likedRests.forEach((t) => addToWheel(t));
      };

      // Modal Methods

      const formatPrice = (price) => {
        if (price === null || price === undefined || price === "")
          return "가격 정보 없음";

        const numPrice = Number(price);
        if (isNaN(numPrice) || numPrice === 0) return "가격 정보 없음";

        return `${numPrice.toLocaleString()}원`;
      };

      const addMenuInput = () => {
        restaurantForm.value.menus.push({
          name: "",
          price: "",
          is_signature: false,
        });
      };

      const removeMenuInput = (index) => {
        restaurantForm.value.menus.splice(index, 1);
      };

      const toggleMenuSignature = (index) => {
        const menu = restaurantForm.value.menus[index];
        if (menu) {
          menu.is_signature = !menu.is_signature;
        }
      };

      const cleanNumber = (value) => {
        if (typeof value === "string") {
          return value.replace(/[^0-9]/g, "");
        }
        return String(value);
      };

      const formatNumberWithCommas = (value) => {
        const cleaned = cleanNumber(value);
        if (!cleaned) return "";
        return Number(cleaned).toLocaleString("ko-KR");
      };

      const calculateAvgPrice = (menus) => {
        if (!menus || menus.length === 0) return 0;

        const validPrices = menus
          .map((m) => Number(m.price) || 0)
          .filter((p) => p > 0);

        if (validPrices.length === 0) return 0;

        const sum = validPrices.reduce((total, price) => total + price, 0);
        const avg = Math.round(sum / validPrices.length);

        return avg;
      };

      const openModal = (restId) => {
        modalMode.value = "view";

        const rest = restaurants.value.find((r) => r.id === restId);

        if (!rest) {
          showAlert("식당 정보를 찾을 수 없습니다.");
          return;
        }

        selectedRestaurant.value = rest;

        const cachedMenus = menuMap.value[rest.id] || [];
        cachedMenus.sort(
          (a, b) => (b.is_signature === true) - (a.is_signature === true)
        );
        selectedRestaurant.value.menus = cachedMenus;

        reviewForm.value = {
          rate: 0,
          user_name: "",
          comment: "",
          restaurant_id: rest.id,
        };
        modalOpen.value = true;
        updateCurrentModalReviews(rest.id);
        showKebabMenu.value = false;
      };
      const openReadOnlyModal = (restId) => {
        modalMode.value = "readonly";

        const rest = restaurants.value.find((r) => r.id === restId);

        if (!rest) {
          showAlert("식당 정보를 찾을 수 없습니다.");
          return;
        }

        selectedRestaurant.value = rest;

        const cachedMenus = menuMap.value[rest.id] || [];
        cachedMenus.sort(
          (a, b) => (b.is_signature === true) - (a.is_signature === true)
        );
        selectedRestaurant.value.menus = cachedMenus;

        reviewForm.value = {
          rate: 0,
          user_name: "",
          comment: "",
          restaurant_id: rest.id,
        };
        modalOpen.value = true;
        updateCurrentModalReviews(rest.id);
        showKebabMenu.value = false;
      };

      const openAddRestaurantModal = () => {
        modalMode.value = "create";
        restaurantForm.value = {
          id: "",
          name: "",
          category: "",
          tags: [],
          signature_menu: "",
          price: "",
          tagInput: "",
          menus: [{ name: "", price: "", is_signature: false }],
        };
        duplicateList.value = [];
        modalOpen.value = true;
        showKebabMenu.value = false;
      };

      const startEditRestaurant = () => {
        modalMode.value = "edit";
        const r = selectedRestaurant.value;
        const cachedMenus = menuMap.value[r.id] || [];

        restaurantForm.value = {
          id: r.id,
          name: r.name,
          category: r.category,
          tags: JSON.parse(JSON.stringify(r.tags)),
          signature_menu: r.signature_menu,
          price: r.price,
          tagInput: "",
          menus: JSON.parse(JSON.stringify(cachedMenus)),
        };

        duplicateList.value = [];
        showKebabMenu.value = false;
      };

      const closeModal = () => {
        if (isSubmitting.value) return;
        modalOpen.value = false;
        cancelEditReview();
        showCategoryDropdown.value = false;
        showKebabMenu.value = false;
      };
      const handleCancel = () => {
        if (isSubmitting.value) return;
        if (modalMode.value === "edit") {
          modalMode.value = "view";
          duplicateList.value = [];
        } else {
          closeModal();
        }
      };
      const openUserModal = () => {
        showUserModal.value = true;
      };
      const closeUserModal = () => {
        showUserModal.value = false;
      };

      const formatReviewComment = (comment) => {
        if (!comment) return "";
        let formatted = comment;
        const urlRegex =
          /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/gi;
        formatted = formatted.replace(
          urlRegex,
          (url) =>
            '<a href="' +
            url +
            '" target="_blank" class="text-blue-500 hover:text-blue-700 hover:underline">' +
            url +
            "</a>"
        );
        return formatted.replace(/\n/g, "<br>");
      };

      const processTagInput = (e) => {
        if (isComposing.value || !restaurantForm.value.tagInput.trim()) return;
        if (e.key === "Enter" || e.key === " " || e.key === ",") {
          e.preventDefault();
          const val = restaurantForm.value.tagInput.trim();
          if (val && !restaurantForm.value.tags.includes(val))
            restaurantForm.value.tags.push(val);
          restaurantForm.value.tagInput = "";
        }
      };
      const handleCompositionStart = () => {
        isComposing.value = true;
      };
      const handleCompositionEnd = () => {
        isComposing.value = false;
      };
      const removeTag = (index) => {
        restaurantForm.value.tags.splice(index, 1);
      };
      const openCategoryDropdown = () => {
        showCategoryDropdown.value = true;
        focusedCategoryIndex.value = -1;
      };
      const closeCategoryDropdown = () => {
        setTimeout(() => {
          showCategoryDropdown.value = false;
          focusedCategoryIndex.value = -1;
        }, 200);
      };
      const selectCategory = (cat) => {
        restaurantForm.value.category = cat;
        showCategoryDropdown.value = false;
      };
      const onCategoryKeydown = (e) => {
        if (!showCategoryDropdown.value) {
          if (e.key === "ArrowDown") openCategoryDropdown();
          return;
        }
        const options = filteredCategoryOptions.value;
        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (focusedCategoryIndex.value < options.length - 1)
            focusedCategoryIndex.value++;
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (focusedCategoryIndex.value > 0) focusedCategoryIndex.value--;
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (
            focusedCategoryIndex.value >= 0 &&
            focusedCategoryIndex.value < options.length
          ) {
            selectCategory(options[focusedCategoryIndex.value]);
          } else if (options.length === 1) {
            selectCategory(options[0]);
          } else {
            showCategoryDropdown.value = false;
          }
        } else if (e.key === "Escape") {
          showCategoryDropdown.value = false;
        }
      };

      watch(
        () => restaurantForm.value.name,
        (newName) => {
          if (
            !newName ||
            (modalMode.value !== "create" && modalMode.value !== "edit")
          ) {
            duplicateList.value = [];
            return;
          }
          const normalizedInput = newName.replace(/\s/g, "").toLowerCase();
          const duplicates = restaurants.value.filter((r) => {
            if (modalMode.value === "edit" && r.id === restaurantForm.value.id)
              return false;
            const normalizedTarget = r.name.replace(/\s/g, "").toLowerCase();
            return normalizedTarget.includes(normalizedInput);
          });
          duplicateList.value = duplicates;
        }
      );

      const saveRestaurant = async () => {
        if (!restaurantForm.value.name) {
          showAlert("상호명을 입력해주세요.");
          return;
        }
        if (!restaurantForm.value.category) {
          showAlert("카테고리를 입력하거나 선택해주세요.");
          return;
        }
        if (duplicateList.value.length > 0) {
          const confirmSave = await showConfirm(
            `유사한 상호명이 ${duplicateList.value.length}개 존재합니다.\n그래도 저장하시겠습니까?`
          );
          if (!confirmSave) return;
        }

        isSubmitting.value = true;
        const isEdit = modalMode.value === "edit";
        const apiFunc = !isEdit ? "apiAddRestaurant" : "apiUpdateRestaurant";

        console.log("DEBUG PAYLOAD [originMenus]:", restaurantForm.value.menus);

        const cleanMenus = restaurantForm.value.menus
          .filter((m) => m.name && m.name.trim() !== "")
          .map((m) => ({
            name: m.name.trim(),
            price: Number(m.price) || 0,
            is_signature: m.is_signature || false,
          }));
        console.log("DEBUG PAYLOAD [cleanMenus]:", cleanMenus);

        const payload = { ...restaurantForm.value, menus: cleanMenus };

        if (Object.prototype.hasOwnProperty.call(payload, "signature_menu")) {
          delete payload.signature_menu;
        }

        console.log("DEBUG PAYLOAD [Full]:", payload);

        // Optimistic HoF update: new restaurants count fully; edits only add newly inserted menu rows
        const prevMenuCount = isEdit ? (menuMap.value[String(payload.id)] || []).length : 0;
        const hofDelta = isEdit
          ? { menu: Math.max(0, cleanMenus.length - prevMenuCount) }
          : { restaurant: 1, menu: cleanMenus.length };
        bumpMyHofStats(hofDelta);

        google.script.run
          .withSuccessHandler((res) => {
            if (res.success && res.data) {
              refreshHallOfFame();
              const updatedMenus = cleanMenus.map((m) => ({
                restaurant_id: String(res.data.id),
                name: m.name,
                price: m.price,
                is_signature: m.is_signature,
              }));
              menuMap.value[String(res.data.id)] = updatedMenus;

              updateRestaurantLocalState(res.data, isEdit);

              isSubmitting.value = false;

              if (isEdit) {
                modalMode.value = "view";
              } else {
                modalMode.value = "view";
                reviewForm.value = {
                  rate: 0,
                  user_name: "",
                  comment: "",
                  restaurant_id: selectedRestaurant.value.id,
                };
                updateCurrentModalReviews(selectedRestaurant.value.id);

      const addToWheel = (item) => {

      const drawWheel = () => {
        const canvas = document.getElementById("wheelCanvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const width = canvas.width,
          height = canvas.height;
        const verticalOffset = 20;
        const radius = width / 2 - 30;
        const centerX = width / 2,
          centerY = height / 2 + verticalOffset;
        ctx.clearRect(0, 0, width, height);
        if (wheelItems.value.length === 0) {
          ctx.fillStyle = "#f3f4f6";
          ctx.beginPath();
          ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
          ctx.fill();
          ctx.fillStyle = "#9ca3af";
          ctx.font = "20px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("후보 리스트를 추가하세요", centerX, centerY);
          return;
        }
        const step = (2 * Math.PI) / wheelItems.value.length;
        const colors = [
          "#fca5a5",
          "#fdba74",
          "#fcd34d",
          "#86efac",
          "#93c5fd",
          "#c4b5fd",
          "#f9a8d4",
        ];
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(wheelRotation);
        for (let i = 0; i < wheelItems.value.length; i++) {
          const angle = i * step;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius, angle, angle + step);
          ctx.fillStyle = colors[i % colors.length];
          ctx.fill();
          ctx.stroke();
          ctx.save();
          ctx.rotate(angle);
          ctx.beginPath();
          ctx.arc(radius, 0, 3, 0, 2 * Math.PI);
          ctx.fillStyle = "white";
          ctx.fill();
          ctx.strokeStyle = "#d1d5db";
          ctx.stroke();
          ctx.restore();
          ctx.save();
          ctx.rotate(angle + step / 2);
          ctx.textAlign = "right";
          ctx.fillStyle = "#374151";
          ctx.font = "bold 14px sans-serif";
          ctx.fillText(wheelItems.value[i].name, radius - 20, 5);
          ctx.restore();
        }
        ctx.restore();
        ctx.beginPath();
        ctx.arc(centerX, centerY, 5, 0, 2 * Math.PI);
        ctx.fillStyle = "#6b7280";
        ctx.fill();
        ctx.save();
        ctx.translate(centerX, 5 + verticalOffset);
        ctx.rotate(pinAngle);
        ctx.beginPath();
        ctx.arc(0, 0, 8, Math.PI, 0);
        ctx.lineTo(0, 30);
        ctx.lineTo(-8, 0);
        ctx.closePath();
        ctx.fillStyle = "#dc2626";
        ctx.fill();
        ctx.strokeStyle = "#991b1b";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, 2 * Math.PI);
        ctx.fillStyle = "#fca5a5";
        ctx.fill();
        ctx.restore();
      };

      const spinWheel = () => {
        if (isSpinning.value || wheelItems.value.length === 0) return;
        isSpinning.value = true;
        winner.value = null;
        wheelVelocity = 0.4 + Math.random() * 0.1;
        const segAngle = (2 * Math.PI) / wheelItems.value.length;
        const pointerAngle = 1.5 * Math.PI;
        prevIndex = 0;
        const animate = () => {
          wheelVelocity *= 0.99;
          wheelRotation += wheelVelocity;
          const normalizedRot = wheelRotation % (2 * Math.PI);
          const currentRelativeAngle =
            (pointerAngle - normalizedRot + 2 * Math.PI) % (2 * Math.PI);
          const currentIndex = Math.floor(currentRelativeAngle / segAngle);
          if (currentIndex !== prevIndex) {
            pinVelocity -= pinKick;
          }
          prevIndex = currentIndex;
          pinVelocity += (0 - pinAngle) * pinSpring;
          pinVelocity *= pinDamping;
          pinAngle += pinVelocity;
          pinAngle = Math.max(-Math.PI / 18, Math.min(Math.PI / 3, pinAngle));
          drawWheel();
          if (wheelVelocity < 0.002) {
            isSpinning.value = false;
            cancelAnimationFrame(animationId);
            calculateWinner();
            pinAngle = 0;
            drawWheel();
          } else {
            animationId = requestAnimationFrame(animate);
          }
        };
        animate();

      const bumpMyHofStats = (delta) => {

        u.restaurantCount = Math.max(0, u.restaurantCount + (delta.restaurant || 0));
        u.menuCount = Math.max(0, u.menuCount + (delta.menu || 0));
        u.reviewCount = Math.max(0, u.reviewCount + (delta.review || 0));
        u.likeCount = Math.max(0, u.likeCount + (delta.like || 0));

        return array;
      };

      const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

      const generateTeams = async () => {
        if (isTeamAnimating.value) return;

        let pool = [...selectedUsers.value];
        
        Object.keys(customUsersMap.value).forEach(dept => {
           customUsersMap.value[dept].forEach(name => {
             pool.push({
               name: name,
               email: `custom-${Math.random().toString(36).substr(2, 9)}`, // temporary ID
               department: dept,
               isCustom: true
             });
           });
        });

        if (pool.length === 0) {
          showAlert("참여 인원을 선택하거나 추가해주세요.");
          return;
        }

        // Preload avatars to avoid image-load delays during the animation
        pool.forEach(u => {
          if (u.thumbnailPhotoUrl) {
            const img = new Image();
            img.src = u.thumbnailPhotoUrl;
          }
        });

        let teams = [];
        const config = lunchMateConfig.value;
        const val = config.value; // team count or team size, depending on mode

        // --- Mixing strategy ---
        if (config.mixMode === 'dev') {
          // Dev-mix mode: split devs and non-devs so developers are spread across teams
          const devKeywords = ['Solution Development', 'Dev', '개발'];
          const devs = [];
          const others = [];

          pool.forEach(u => {
            const dept = u.department || '';
            const isDev = devKeywords.some(k => dept.includes(k));
            if (isDev) devs.push(u);
            else others.push(u);
          });
          
          shuffleArray(devs);
          shuffleArray(others);

          let teamCount = 0;
          if (config.mode === 'count') {
             teamCount = Math.max(1, Math.min(val, pool.length));
          } else {
             teamCount = Math.ceil(pool.length / Math.max(1, val));
          }
          
          for(let i=0; i<teamCount; i++) teams.push([]);

          // Zigzag assignment: devs first, then everyone else
          let currentTeamIdx = 0;
          
          devs.forEach(u => {
            teams[currentTeamIdx].push(u);
            currentTeamIdx = (currentTeamIdx + 1) % teamCount;
          });
          
          // Continue from the current index so team sizes stay balanced
          others.forEach(u => {
            teams[currentTeamIdx].push(u);
            currentTeamIdx = (currentTeamIdx + 1) % teamCount;
          });
          
          teams.forEach(t => shuffleArray(t));

        } else {
          // Full shuffle mode
          shuffleArray(pool);
          
          if (config.mode === "count") {
            const teamCount = Math.max(1, Math.min(val, pool.length));
            for (let i = 0; i < teamCount; i++) teams.push([]);
            pool.forEach((user, index) => {
              teams[index % teamCount].push(user);
            });
          } else {
            const teamSize = Math.max(1, val);
            for (let i = 0; i < pool.length; i += teamSize) {
              teams.push(pool.slice(i, i + teamSize));
            }
          }
        }

        // --- Animation ---
        isTeamAnimating.value = true;
        lunchMateTeams.value = teams;
        
        displayTeams.value = teams.map(() => []);

        const animationQueue = [];
        teams.forEach((team, teamIndex) => {
          team.forEach(user => {
            animationQueue.push({ user, teamIndex });
          });
        });

        // Shuffle the queue so members fly out in random order
        shuffleArray(animationQueue);

        nextTick(() => {
           const resultSection = document.getElementById('lunchMateResult');
           if(resultSection) resultSection.scrollIntoView({ behavior: 'smooth' });
        });

        for (const item of animationQueue) {
          currentAnimatingUser.value = item.user;
          
          await delay(400); 

          displayTeams.value[item.teamIndex].push(item.user);
          
          currentAnimatingUser.value = null;
          
          await delay(100); 
        }

        isTeamAnimating.value = false;
      };

      const copyTeamResult = () => {
        if (lunchMateTeams.value.length === 0) return;

        let text = "🍴 [누구랑 먹지?] 조 편성 결과\n\n";
        lunchMateTeams.value.forEach((team, idx) => {
          text += `📍 ${idx + 1}조: ${team.map((u) => u.name).join(", ")}\n`;
        });

        const tempInput = document.createElement("textarea");
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);

        showAlert("편성 결과가 클립보드에 복사되었습니다.", "복사 완료");
      };

      const handleMenuPriceInput = (menuItem, newFormattedValue) => {
        const cleanedValue = cleanNumber(newFormattedValue);
        menuItem.price = parseInt(cleanedValue) || 0;
      };

      const formatDateTime = (dateStr) => {
        if (!dateStr) return "";
        try {
          const d = new Date(dateStr);
          const datePart = `${d.getFullYear()}-${(d.getMonth() + 1)
            .toString()
            .padStart(2, "0")}-${d.getDate().toString().padStart(2, "0")}`;
          const timePart = `${d.getHours().toString().padStart(2, "0")}:${d
            .getMinutes()
            .toString()
            .padStart(2, "0")}:${d.getSeconds().toString().padStart(2, "0")}`;
          return `${datePart} ${timePart}`;
        } catch (e) {
          return "날짜 오류";
        }
      };

      // --- Watchers ---
      watch(isLoading, (newVal, oldVal) => {
        if (oldVal === true && newVal === false) {
          nextTick(() => {
            if (windowWidth.value >= 768) {
              isFilterOpen.value = true;
            }
          });
        }
      });

      onMounted(() => {
        loadData();
        loadHallOfFame();
        window.addEventListener("resize", updateWidth);
        watch(currentTab, (newVal) => {
          if (newVal === "wheel") nextTick(() => drawWheel());
          if (newVal === "halloffame") loadHallOfFame();
        });

        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (isSubmitting.value) return;

            if (showKebabMenu.value) {
              showKebabMenu.value = false;
              return;
            }

            if (sortDropdownOpen.value) {
              sortDropdownOpen.value = false;
              return;
            }
            if (pageSizeDropdownOpen.value) {
              pageSizeDropdownOpen.value = false;
              return;
            }

            if (alertState.value.visible) onAlertCancel();
            else if (showUserModal.value) closeUserModal();
            else if (modalOpen.value) {
              if (modalMode.value === "view" || modalMode.value === "readonly")
                closeModal();
            }
          }
        });

        watch(modalOpen, (val) => {
          document.body.style.overflow = val ? "hidden" : "auto";
          showKebabMenu.value = false;
        });

        watchEffect(() => {
          restaurantForm.value.price = calculatedPriceDisplay.value;
        });

        document.addEventListener("click", (e) => {
          const button = kebabButton.value;
          if (showKebabMenu.value && button && !button.contains(e.target)) {
            let target = e.target;
            let isKebabMenuClicked = false;
            while (target) {
              if (
                target.classList &&
                target.classList.contains("kebab-dropdown")
              ) {
                isKebabMenuClicked = true;
                break;
              }
              target = target.parentNode;
            }
            if (!isKebabMenuClicked) {
              showKebabMenu.value = false;
            }
          }

          if (sortDropdownOpen.value) {
            if (!e.target.closest(".js-sort-dropdown")) {
              sortDropdownOpen.value = false;
            }
          }

          if (pageSizeDropdownOpen.value) {
            if (!e.target.closest(".js-pagesize-dropdown")) {
              pageSizeDropdownOpen.value = false;
            }
          }
        });
      });

      return {
        restaurants,
        currentTab,
        pageSize,
        currentPage,
        isLoading,
        currentUser,
        userInitial,
        userId,
        canEditRestaurant,
        userReviewCount,
        userRankInfo,
        isFilterOpen,
        filters,
        toggleFilter,
        toggleFilterItem,
        uniqueCategories,
        uniqueTags,
        filteredRestaurants,
        paginatedRestaurants,
        totalPages,
        sort,
        setSort,
        setSortOrder,
        getSortIcon,
        modalOpen,
        modalMode,
        selectedRestaurant,
        restaurantForm,
        duplicateList,
        isNewCategory,
        filteredCategoryOptions,
        showCategoryDropdown,
        focusedCategoryIndex,
        openModal,
        openReadOnlyModal,
        openAddRestaurantModal,
        startEditRestaurant,
        closeModal,
        processTagInput,
        handleCompositionStart,
        handleCompositionEnd,
        isComposing,
        removeTag,
        saveRestaurant,
        deleteRestaurant,
        openCategoryDropdown,
        closeCategoryDropdown,
        selectCategory,
        onCategoryKeydown,
        reviews,
        reviewForm,
        isSubmitting,
        submitReview,
        deleteReview,
        canEditReview,
        canDeleteReview,
        startEditReview,
        cancelEditReview,
        saveEditReview,
        highlightReviewId,
        editingReviewId,
        editForm,
        isReviewSubmitting,
        hoverRate,
        formatDate,
        wheelItems,
        wheelSearch,
        addToWheel,
        removeFromWheel,
        spinWheel,
        isSpinning,
        winner,
        addCategoryToWheel,
        addAllToWheel,
        clearWheel,
        filteredWheelCandidates,
        resetWheel,
        isWheelListExpanded,
        tooltipVisible,
        tooltipData,
        tooltipPos,
        updateTooltip,
        hideTooltip,
        alertState,
        onAlertConfirm,
        onAlertCancel,
        windowWidth,
        menuMap,
        showUserModal,
        openUserModal,
        closeUserModal,
        searchQuery,
        APP_VERSION,
        GOOGLE_SHEET_URL,
        BASE_WEBAPP_URL,
        handleCancel,
        formatReviewComment,
        userLikes,
        isLiked,
        toggleLike,
        showLikeFilter,
        toggleLikeFilter,
        showMyReviewsFilter,
        showPendingReviewsFilter,
        addLikedToWheel,
        myReviewedRestaurantIds,
        showKebabMenu,
        toggleKebabMenu,
        kebabButton,
        sortDropdownOpen,
        pageSizeDropdownOpen,
        toggleSortDropdown,
        togglePageSizeDropdown,
        toggleMenuSignature,
        formatPrice,
        addMenuInput,
        removeMenuInput,
        sortedMenus,
        handleMenuPriceInput,
        formatNumberWithCommas,
        calculatedPriceDisplay,
        getFormattedMenuString,
        myPageTab,
        myLikedRestaurants,
        myReviews,
        formatDateTime,
        isMobile,
        loadingText,
        allUsers,
        lunchMateConfig,
        selectedUserEmails,
        lunchMateTeams,
        displayTeams,
        isTeamAnimating,
        currentAnimatingUser,
        selectedUsers,
        usersByDepartment,
        customUsersMap,
        toggleUserSelection,
        toggleAllInDept,
        deptSelectState,
        checkStateIcon,
        allSelectState,
        toggleAllUsers,
        hallOfFame,
        isHofLoading,
        hofPodium,
        hofCategoryBoards,
        hofReviewerBoards,
        addCustomUser,
        removeCustomUser,
        isUserSelected,
        generateTeams,
        copyTeamResult,
        adminEmailsList,
        newAdminEmail,
        adminGuests,
        newGuestForm,
        addAdminEmail,
        deleteAdminEmail,
        addAdminGuest,
        deleteAdminGuest,
        excludedEmailsList,
        newExcludedEmail,
        addExcludedEmail,
        deleteExcludedEmail,
      };
    },
  }).mount("#app");
